name: Threads Auto Post Cronjob

on:
  workflow_dispatch:

jobs:
  post-threads:
    runs-on: windows-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v3

      - name: Cài đặt môi trường Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cài đặt thư viện cần thiết
        run: |
          pip install playwright requests regex gspread oauth2client pillow pyotp pytz
          playwright install chromium

      - name: Tái tạo file credentials.json từ Secret
        shell: bash
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDS" > credentials.json

      - name: Tính hash cookie nguồn
        id: cookie-hash
        shell: pwsh
        run: |
          $hash = "${{ hashFiles('cookies/*.json', '!cookies/profile_paths.json') }}"
          "hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Khôi phục Cookie đã làm mới từ lần chạy trước
        uses: actions/cache/restore@v4
        with:
          path: |
            cookies/*.json
            !cookies/profile_paths.json
          key: cookies-${{ runner.os }}-${{ steps.cookie-hash.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            cookies-${{ runner.os }}-${{ steps.cookie-hash.outputs.hash }}-

      - name: Chạy Tool Auto Post
        env:
          PYTHONIOENCODING: "utf-8"
          PYTHONUNBUFFERED: "1"
          ALLOW_AUTO_LOGIN: "0"
        run: python -u thread_autopost_tool.py

      - name: Lưu lại Cookie mới sau phiên chạy
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cookies/*.json
            !cookies/profile_paths.json
          key: cookies-${{ runner.os }}-${{ steps.cookie-hash.outputs.hash }}-${{ github.run_id }}

      - name: Lưu ảnh chụp màn hình khi bị lỗi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: "error_logs/"
